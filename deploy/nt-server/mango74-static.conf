# Include this file only inside the active HTTPS server block for
# www.mangosgo.com. It owns /mango74 only; all other routes fall through to
# the existing NT Server configuration.

location = /mango74 {
    return 308 /mango74/;
}

location ^~ /mango74/_next/ {
    root /var/www;
    try_files $uri =404;
}

location ^~ /mango74/ {
    root /var/www;
    try_files $uri $uri/ /mango74/index.html;
}
