# Managed by mango74-api-proxy.py. Owns /api/ only inside the www.mangosgo.com
# server block; every other route on this vhost falls through untouched.
#
# Forwards to the Notebook's local origin over the point-to-point WireGuard
# link declared in deploy/wireguard/ (upstream.conf.example fixes the
# Notebook's tunnel address at 10.10.0.2). This is the only path from the NT
# Server to the AI backend - no public IP, Cloudflare hostname, or inbound
# port on the Notebook is involved.

location ^~ /api/ {
    proxy_pass http://10.10.0.2:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    client_max_body_size 10m;
}
