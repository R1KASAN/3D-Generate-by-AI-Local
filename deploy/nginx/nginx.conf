worker_processes  1;

error_log  logs/error.log warn;
pid        logs/nginx.pid;

events {
    worker_connections  256;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log    logs/access.log;
    sendfile      on;
    server_tokens off;

    client_max_body_size 10m;
    client_body_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Two private entry points reach this origin, never the public Internet
    # directly (constitution II): the named Cloudflare Tunnel on loopback, and
    # the NT Server reverse-proxying /api/ over a point-to-point WireGuard link
    # (deploy/wireguard/, address fixed at 10.10.0.2 per upstream.conf.example).
    # `default_server` on each listen line makes this block answer any Host on
    # that socket, so it does not matter which Host header a caller sends.
    server {
        listen 127.0.0.1:8080 default_server;
        listen 10.10.0.2:8080 default_server;
        server_name mango74-api.mangosgo.com www.mangosgo.com;

        location = / {
            return 404;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
        }

        location / {
            return 404;
        }

        error_page 400 404 413 500 502 503 504 /errors/50x.html;
        location = /errors/50x.html {
            alias errors/50x.html;
            internal;
        }
    }
}
