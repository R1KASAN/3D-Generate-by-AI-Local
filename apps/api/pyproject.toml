[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "local-3d-api"
version = "0.1.0"
description = "FastAPI controller for the Local 3D Generative AI Server"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiosqlite==0.21.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "Pillow==11.3.0",
  "pydantic==2.11.7",
  "python-multipart==0.0.20",
  "PyYAML==6.0.2",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/local3d"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["local3d"]

